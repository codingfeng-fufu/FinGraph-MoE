[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moe-gnn"
version = "0.1.0"
description = "FinGraph-MoE: query-conditioned document-to-graph experts for financial numerical reasoning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "faiss-cpu>=1.8",
  "joblib>=1.3",
  "numpy>=1.24",
  "pydantic>=2.0",
  "scikit-learn>=1.3",
  "sentence-transformers>=2.7",
  "torch>=2.1",
  "torch-geometric>=2.7",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps",
  "src/moe_router",
  "src/realdata_experts",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = [
  "tests/test_current_realdata_benchmark.py",
  "tests/test_demo_qa_benchmark_assets.py",
  "tests/test_document_graph.py",
  "tests/test_graph_extraction.py",
  "tests/test_llm_document_extractor.py",
  "tests/test_realdata_router.py",
]
